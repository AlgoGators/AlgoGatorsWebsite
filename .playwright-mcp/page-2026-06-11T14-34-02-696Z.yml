        - paragraph [ref=e61]: ▲The Fund
        - paragraph [ref=e62]: The AlgoGators Investment Fund was launched in the Fall Semester of 2023. We currently have a team of 34, with backgrounds ranging from Finance to Computer Science to Biomedical Engineering. We are one of the only organizations in the country to offer undergraduate students an opportunity to trade live capital using sophisticated, algorithm-driven investment strategies.
        - paragraph [ref=e63]: Our mission is to democratize the field of quantitative finance by making it accessible to a broader audience — providing our members with hands-on experience and the skills needed to excel in the industry.
