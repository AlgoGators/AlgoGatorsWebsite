      - heading "How We Train" [level=1] [ref=e21]
      - paragraph [ref=e22]: We prepare some of the brightest minds through a structured blend of intensive learning, collaborative mentorship, and real-world application.
    - generic [ref=e25]:
      - generic [ref=e26]:
        - paragraph [ref=e27]: 01The Curriculum
        - heading "11 Weeks. Zero Shortcuts." [level=2] [ref=e28]:
          - text: 11 Weeks.
          - text: Zero Shortcuts.
        - paragraph [ref=e29]: The AlgoGators Analyst Training Program is an intensive, 11-week curriculum designed to provide new analysts with the foundational skills and knowledge necessary to excel in quantitative finance. Our program covers essential topics, including derivative pricing, statistical modeling, algorithm development, risk management, and computer programming.
        - paragraph [ref=e30]: Through live lectures from distinguished professors and guest speakers, analysts engage with both theoretical and practical components of financial markets. The program also incorporates biweekly readings, assignments, and one-on-one office hour discussions with senior team members.
      - generic [ref=e31]:
        - paragraph [ref=e32]: Program Highlights
        - list [ref=e33]:
          - listitem [ref=e34]: 11-week intensive curriculum
          - listitem [ref=e35]: Live lectures from professors & guest speakers
          - listitem [ref=e36]: Derivative pricing & statistical modeling
          - listitem [ref=e37]: Algorithm development & risk management
          - listitem [ref=e38]: One-on-one mentorship with senior analysts
          - listitem [ref=e39]: Biweekly readings & assignments
    - generic [ref=e41]:
      - generic [ref=e42]:
        - heading "Capstone Project" [level=2] [ref=e43]
        - paragraph [ref=e44]: 02Semester-Long Research
      - generic [ref=e45]:
        - paragraph [ref=e46]: The capstone project is the culminating experience of the AlgoGators Analyst Training Program, designed to integrate and apply the skills and knowledge acquired throughout the course. This semester-long research initiative incentivizes analysts to explore specialized topics and demonstrate their ability to think critically and strategically.
        - paragraph [ref=e47]: Each analyst selects a research topic closely aligned with their specific role, using advanced quantitative methods, data analysis, and programming skills to test hypotheses, analyze market behaviors, and assess financial instruments.
