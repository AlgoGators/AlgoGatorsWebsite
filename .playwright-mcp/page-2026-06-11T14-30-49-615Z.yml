        - paragraph [ref=e229]: Dustin Hebrank serves as AlgoGators' Director. He was the Chief Financial Officer at Gulf Winds International, a position he held since being introduced to the company in 2012 through the C12 network. His career began with Hilton Hotels in 1998 as Director of Finance, after which he joined a boutique investment bank in Tampa in 2004 to assist companies in raising growth and acquisition capital.
